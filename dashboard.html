<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Çağrı Merkezi Dashboard</title>

<style>
:root{
    --bg1:#0b132b;
    --bg2:#1c2541;
    --card-bg:rgba(255,255,255,.04);
    --border:rgba(255,255,255,.08);
    --primary:#38bdf8;
    --text:#f8fafc;
    --text-soft:#cbd5e1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    padding:30px;
}

.dashboard{
    max-width:1500px;
    margin:auto;
}

/* HEADER */

.top-header{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-bottom:35px;
}

.announcement-box{
    flex:1;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-left:4px solid var(--primary);
    border-radius:14px;
    padding:15px 20px;
    backdrop-filter:blur(10px);
}

.datetime-box{
    min-width:230px;
    text-align:center;
    background:rgba(15,23,42,.75);
    border:1px solid var(--border);
    border-radius:14px;
    padding:15px;
    color:var(--primary);
    font-weight:600;
}

/* SECTION */

.section{
    margin-bottom:40px;
}

.section-title{
    font-size:1.2rem;
    font-weight:600;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:10px;
}

.section-title::before{
    content:'';
    width:8px;
    height:18px;
    background:var(--primary);
    border-radius:10px;
}

/* MODULES */

.modules-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.module-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    backdrop-filter:blur(16px);
    transition:.25s;
}

.module-card:hover{
    transform:translateY(-4px);
    border-color:rgba(56,189,248,.5);
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.module-card-title{
    color:#93c5fd;
    font-weight:600;
    margin-bottom:10px;
}

.module-description{
    color:var(--text-soft);
    font-size:.92rem;
}

.module-link{
    display:inline-block;
    margin-top:18px;
    color:var(--primary);
    text-decoration:none;
    font-size:.9rem;
    font-weight:600;
}

/* COMPANY LOGOS */

.companies-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.company-card{
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    text-decoration:none;
    transition:.25s;
    padding:15px;
}

.company-card:hover{
    transform:translateY(-3px);
    border-color:rgba(56,189,248,.5);
}

.company-card img{
    max-width:90%;
    max-height:90%;
    object-fit:contain;
}

.loading{
    text-align:center;
    color:#94a3b8;
    padding:20px;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .top-header{
        flex-direction:column;
    }

    .datetime-box{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="dashboard">

    <!-- HEADER -->
    <header class="top-header">

        <div class="announcement-box">
            <strong>Duyuru:</strong>
            <span id="announcementText">
                Dashboard yükleniyor...
            </span>
        </div>

        <div class="datetime-box" id="datetime"></div>

    </header>

    <!-- MODÜLLER -->

    <section class="section">

        <h2 class="section-title">
            Modüller
        </h2>

        <div class="modules-grid" id="modulesContainer">

            <div class="loading">
                Modüller yükleniyor...
            </div>

        </div>

    </section>

    <!-- BORÇ SORGULAMA -->

    <section class="section">

        <h2 class="section-title">
            Borç Sorgulama
        </h2>

        <div class="companies-grid" id="companiesContainer">

            <div class="loading">
                Şirketler yükleniyor...
            </div>

        </div>

    </section>

</div>

<script>

const API_URL = "/api/settings";

function updateDateTime(){

    const now = new Date();

    const date = now.toLocaleDateString("tr-TR",{
        day:"2-digit",
        month:"long",
        year:"numeric"
    });

    const time = now.toLocaleTimeString("tr-TR",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    });

    document.getElementById("datetime").textContent =
        `${date} | ${time}`;
}

updateDateTime();
setInterval(updateDateTime,1000);

async function loadDashboard(){

    try{

        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("API bağlantı hatası");
        }

        const data = await response.json();

        /* DUYURU */

        if(data.announcement){

            document.getElementById("announcementText")
                .textContent = data.announcement;
        }

        /* MODÜLLER */

        const modulesContainer =
            document.getElementById("modulesContainer");

        modulesContainer.innerHTML = "";

        if(data.modules && data.modules.length){

            data.modules.forEach(module => {

                const card = document.createElement("div");

                card.className = "module-card";

                card.innerHTML = `
                    <div class="module-card-title">
                        ${module.title}
                    </div>

                    <div class="module-description">
                        ${module.description || ""}
                    </div>

                    <a
                        class="module-link"
                        href="${module.url}"
                    >
                        Modülü Aç →
                    </a>
                `;

                modulesContainer.appendChild(card);

            });

        }

        /* ŞİRKETLER */

        const companiesContainer =
            document.getElementById("companiesContainer");

        companiesContainer.innerHTML = "";

        if(data.companies && data.companies.length){

            data.companies.forEach(company => {

                const card = document.createElement("a");

                card.className = "company-card";
                card.href = company.link;
                card.target = "_blank";

                card.innerHTML = `
                    <img
                        src="${company.logo}"
                        alt="${company.name}">
                `;

                companiesContainer.appendChild(card);

            });

        }

    }
    catch(error){

        console.error(error);

        document.getElementById("announcementText")
            .textContent =
            "Sistem ayarları yüklenemedi.";

    }
}

loadDashboard();

</script>

</body>
</html>
