<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Duyuru</title>
<style>
       body {
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background-color: #f4f4f9;
           color: #333;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           margin: 0;
           padding: 20px;
           box-sizing: border-box;
       }
       .card {
           background: #ffffff;
           padding: 40px 30px;
           border-radius: 12px;
           box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
           text-align: center;
           max-width: 450px;
           width: 100%;
       }
       h1 {
           font-size: 24px;
           margin-top: 0;
           margin-bottom: 12px;
           color: #111;
       }
       p {
           font-size: 16px;
           line-height: 1.5;
           color: #555;
           margin-bottom: 24px;
       }
       .btn {
           display: inline-block;
           background-color: #0066cc;
           color: #ffffff;
           text-decoration: none;
           padding: 12px 24px;
           border-radius: 6px;
           font-weight: 500;
           transition: background-color 0.2s;
       }
       .btn:hover {
           background-color: #0052a3;
       }
</style>
</head>
<body>
<div class="card">
<h1>Duyuru</h1>
<p>Sizlere daha iyi hizmet verebilmek için yeni adresimize geçiş yaptık.</p>
<a href="https://mfyuser.github.io/palbull/dashboard.html" class="btn">Yeni Sayfaya Git</a>
</div>
</body>
</html>
