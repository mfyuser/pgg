<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALBull</title>
<script>try{if(localStorage.getItem('pb-theme')==='blue')document.documentElement.dataset.theme='blue'}catch(e){}</script>
<link rel="icon" id="fav" type="image/svg+xml" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --p:#b3141f; --p2:#7f0d17; --pl:#fcebed; --pt:#8f0f19;
    --grad:linear-gradient(115deg,#c9192c 0%,#9c111d 55%,#7f0d17 100%);
    --bg:#f5f1f2; --card:#fff; --line:#e9e1e3; --tx:#1b1a21; --mut:#6f7080;
    --sh:0 1px 2px rgba(60,20,30,.06),0 10px 26px -14px rgba(60,20,30,.22);
    --gold:#b7791f; --teal:#0f766e; --slate:#475569; --neon:#ff1f4b;
  }
  :root[data-theme="blue"]{
    --p:#1d4ed8; --p2:#13307f; --pl:#e8effd; --pt:#17389c;
    --grad:linear-gradient(115deg,#2f6bf0 0%,#1d4ed8 55%,#13307f 100%);
    --neon:#1f6bff; --bg:#eef2f9; --line:#dde5f3; --sh:0 1px 2px rgba(20,40,90,.07),0 10px 26px -14px rgba(20,40,90,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none} button{cursor:pointer;border:0;background:none;color:inherit;font:inherit}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  .num,.wm,h1,h2{font-family:'Sora','Inter',system-ui,sans-serif}

  .wm{font-weight:300;letter-spacing:-.02em;line-height:1}
  .wm b{font-weight:800;letter-spacing:-.01em}
  .emb{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#fff;color:var(--p);box-shadow:0 2px 8px rgba(0,0,0,.18);flex-shrink:0}
  .emb svg{width:26px;height:26px;fill:currentColor}

  .topbar{position:fixed;inset:0 0 auto 0;height:64px;z-index:30;display:flex;align-items:center;gap:14px;padding:0 24px 0 14px;color:#fff;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),var(--grad);box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .burger{width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
  .burger:hover{background:rgba(255,255,255,.14)}
  .brand{display:flex;align-items:center;gap:12px;font-size:24px;padding-left:4px}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .search{position:relative}
  .search input{width:320px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;padding:0 64px 0 38px;font-size:13px}
  .search input::placeholder{color:rgba(255,255,255,.8)}
  .search input:focus{background:rgba(255,255,255,.2);outline:0}
  .search>svg{position:absolute;left:13px;top:12px}
  .kbd{position:absolute;right:8px;top:8px;font-size:10px;background:rgba(255,255,255,.18);border-radius:6px;padding:3px 7px}
  .results{position:absolute;top:46px;left:0;right:0;background:var(--card);color:var(--tx);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:6px;display:none}
  .results.open{display:block}
  .results a{display:block;padding:10px 12px;border-radius:9px;font-size:13px}
  .results a:hover,.results a.sel{background:var(--pl)}
  .results em{font-style:normal;color:var(--mut);font-size:11px;margin-left:6px}
  .theme{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 10px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);font-size:12px;font-weight:500}
  .theme:hover{background:rgba(255,255,255,.2)}
  .sw{display:flex}.sw i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
  .sw i:first-child{background:#c9192c}.sw i:last-child{background:#2f6bf0;margin-left:-5px}

  .sidebar{position:fixed;top:64px;bottom:0;left:0;width:268px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px 16px;overflow:auto;z-index:20;transition:transform .25s;display:flex;flex-direction:column}
  body.collapsed .sidebar{transform:translateX(-100%)} body.collapsed .main{margin-left:0}
  .sec-l{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--mut);padding:0 12px 10px}
  .nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:500;text-align:left;color:#34333d}
  .nav-item svg.ico{color:var(--mut);flex-shrink:0}
  .nav-item .chev{margin-left:auto;color:var(--mut);transition:transform .2s}
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{background:var(--pl);color:var(--pt);font-weight:600}
  .nav-item.active svg.ico{color:var(--p)}
  .nav-item.open .chev{transform:rotate(90deg)}
  .sub{display:none;margin:2px 0 8px 22px;border-left:1px solid var(--line);padding-left:8px}
  .sub.open{display:block}
  .sub a{display:flex;align-items:center;gap:.8em;padding:7px 10px;font-size:12.5px;color:#55566a;border-radius:9px}
  .sub a:hover{color:var(--pt);background:var(--pl)}
  .sl{flex:0 0 1.9em;height:1.9em;display:grid;place-items:center;background:#fff;border-radius:.45em;padding:.2em;border:1px solid var(--line)}
  .sl svg{width:100%;height:100%;color:var(--p)}
  .status{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--mut)}
  .status b{display:block;color:var(--tx);font-size:12.5px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.15);flex-shrink:0}
  .dot.off{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.15)}

  .main{margin-left:268px;padding:92px 36px 36px;transition:margin .25s;max-width:1500px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .head h1{font-size:26px;font-weight:700;letter-spacing:-.03em}
  .head p{color:var(--mut);font-size:13px;margin-top:6px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--pt)}
  .btn:hover{border-color:var(--p);background:var(--pl)}
  .btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px var(--p)}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.spin svg{animation:spin .7s linear} @keyframes spin{to{transform:rotate(360deg)}}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--sh);overflow:hidden}
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .kpi .lb{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
  .kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
  .kpi .num{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .kpi small{display:block;margin-top:6px;font-size:11.5px;color:var(--mut)}

  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px}
  .sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .sec-h span{font-size:12px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh);transition:transform .2s,border-color .2s,box-shadow .2s}
  .card:hover{transform:translateY(-3px);border-color:var(--p);box-shadow:0 16px 34px -16px var(--p)}
  .card .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px var(--p)}
  .card h3{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .card p{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:5px}
  .card .go{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--pt)}
  .card:hover .go svg{transform:translateX(3px)} .go svg{transition:transform .2s}
  .tag{font-size:10px;font-weight:600;background:#fef3c7;color:#92600a;border-radius:99px;padding:2px 8px;font-family:Inter,sans-serif}
  .foot{margin-top:30px;font-size:11.5px;color:var(--mut)} .foot a{text-decoration:underline}

  .intro{position:fixed;inset:0;z-index:100;background:#fff;overflow:hidden;transition:opacity .7s ease,visibility .7s}
  .intro.out{opacity:0;visibility:hidden}
  .ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:fin .6s ease both}
  @keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .bw{position:relative;display:inline-block;--ox:38%;--oy:27%}
  .nl-bull{display:block;height:clamp(220px,38vh,360px);width:auto;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px var(--neon))}
  @keyframes breathe{0%,100%{transform:scale(1,1);filter:drop-shadow(0 0 6px var(--neon))}40%{transform:scale(1.022,1.034);filter:drop-shadow(0 0 16px var(--neon))}}
  .puff{position:absolute;left:var(--ox);top:var(--oy);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle,rgba(130,130,148,.6),rgba(130,130,148,0) 70%);filter:blur(2px);animation:puff 2.4s ease-out infinite}
  .puff.n2{margin-left:-9px;margin-top:-17px}
  @keyframes puff{0%,38%{opacity:0;transform:translate(0,0) scale(.25)}46%{opacity:.7}100%{opacity:0;transform:translate(var(--dx,-70px),-80px) scale(3)}}
  .nl-wm{font-size:clamp(40px,8vw,68px);color:var(--tx)} .nl-wm b{color:var(--p)}
  .nl-load{width:min(300px,70vw)}
  .nl-row{display:flex;justify-content:space-between;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--mut);margin-bottom:8px}
  .nl-track{height:6px;border-radius:6px;background:#eceaec;overflow:hidden}
  #lbar{display:block;height:100%;width:0;border-radius:6px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
  .skip{position:absolute;right:20px;bottom:20px;z-index:5;color:#55566a;background:#f1eff1;border-radius:99px;padding:8px 16px;font-size:12px;font-weight:600}
  .skip:hover{background:#e6e3e6}
  @media(max-width:1200px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:1000px){
    .sidebar{transform:translateX(-100%);box-shadow:8px 0 30px rgba(0,0,0,.18)} body.collapsed .sidebar{transform:none}
    .main,body.collapsed .main{margin-left:0;padding:88px 16px 28px}
    .search input{width:150px}.kbd,.theme span.tt{display:none}
  }
  @media(max-width:620px){.kpis,.grid{grid-template-columns:1fr}.brand{font-size:20px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="mark" viewBox="0 0 48 48">
    <mask id="cut"><rect width="48" height="48" fill="#fff"/><path d="M15 20c3-1.500 6-2 9-2s6 .5 9 2l-3 15c-.8 3.500-3.200 6-6 6s-5.200-2.500-6-6z" fill="#000" stroke="#000" stroke-width="2.400" stroke-linejoin="round"/><path d="M13 22l-8-1c.5 3 3 5 7 5.500zM35 22l8-1c-.5 3-3 5-7 5.500z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/></mask>
    <path mask="url(#cut)" d="M1.500 4c.5 15 9 26 22.500 26S46 19 46.500 4c-4 9-9 13-14 14.500H15.500C10.500 17 5.500 13 1.500 4z"/>
    <path d="M13 22l-8-1c.5 3 3 5 7 5.500zM35 22l8-1c-.5 3-3 5-7 5.500z"/>
    <path fill-rule="evenodd" d="M15 20c3-1.500 6-2 9-2s6 .5 9 2l-3 15c-.8 3.500-3.200 6-6 6s-5.200-2.500-6-6z M17.500 24l4 1.500-.4 1.800-3.800-1.200z M30.500 24l-4 1.500.4 1.800 3.800-1.200z M20.600 36a1 1 0 1 0 2 0a1 1 0 1 0-2 0z M25.400 36a1 1 0 1 0 2 0a1 1 0 1 0-2 0z"/>
  </symbol>
</svg>

<div class="intro" id="intro" role="dialog" aria-label="PALBull yükleniyor">
  <div class="ld">
    <div class="bw">
      <img class="nl-bull" id="nlb" alt="PALBull">
      <i class="puff"></i><i class="puff" style="animation-delay:.14s;--dx:-95px"></i><i class="puff" style="animation-delay:.3s;--dx:-45px"></i>
      <i class="puff n2" style="animation-delay:.07s;--dx:-110px"></i><i class="puff n2" style="animation-delay:.22s;--dx:-60px"></i>
    </div>
    <div class="wm nl-wm"><b>PAL</b>Bull</div>
    <div class="nl-load"><div class="nl-row"><span>Sayfa yükleniyor</span><span id="lpct">%0</span></div><div class="nl-track"><span id="lbar"></span></div></div>
  </div>
  <button class="skip" id="skip">Geç</button>
</div>
<script>try{if(sessionStorage.getItem('pb-intro')||matchMedia('(prefers-reduced-motion:reduce)').matches){document.getElementById('intro').remove()}}catch(e){}</script>

<header class="topbar">
  <button class="burger" id="burger" aria-label="Menüyü aç/kapat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <a class="brand" href="#top" aria-label="PALBull"><span class="emb"><svg viewBox="0 0 48 48"><use href="#mark"/></svg></span><span class="wm"><b>PAL</b>Bull</span></a>
  <div class="tb-right">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Menüde ara" autocomplete="off"><span class="kbd">Ctrl K</span>
      <div class="results" id="results"></div>
    </div>
    <button class="theme" id="theme" aria-label="Temayı değiştir (kırmızı / mavi)"><span class="sw"><i></i><i></i></span><span class="tt">Tema</span></button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="sec-l">MENÜ</div>
  <a class="nav-item active" href="#top"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Gösterge Paneli</a>
  <button class="nav-item" data-sub="subMods"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="2.500" width="16" height="19" rx="2.500"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2"/></svg>Modüller<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg></button>
  <div class="sub" id="subMods"></div>
  <div class="status"><span class="dot" id="dot"></span><div><b id="stT">Kur servisi</b><span id="stS">Bağlanıyor…</span></div></div>
</aside>

<main class="main" id="top">
  <div class="head">
    <div><h1>Gösterge Paneli</h1><p id="date"></p></div>
    <div class="actions" id="quick"><button class="btn pri" id="refresh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.700M21 4v5h-5"/></svg>Yenile</button></div>
  </div>

  <section class="kpis">
    <div class="kpi" style="--c:var(--p)"><div class="top"><span class="lb">USD / TRY</span><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6.500C16 5 14.300 4.500 12 4.500c-2.800 0-4.500 1.200-4.500 3.200s1.700 2.800 4.500 3.300 4.500 1.300 4.500 3.300-1.700 3.200-4.500 3.200c-2.400 0-4.200-.6-5.200-2.200"/></svg></span></div><div class="num" id="usd">…</div><small id="usdSub">Canlı kur</small></div>
    <div class="kpi" style="--c:var(--gold)"><div class="top"><span class="lb">EUR / TRY</span><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 5.500A7 7 0 1 0 17 18.500M4 10h9M4 14h9"/></svg></span></div><div class="num" id="eur">…</div><small id="eurSub">Canlı kur</small></div>
    <div class="kpi" style="--c:var(--teal)"><div class="top"><span class="lb">EUR / USD Parite</span><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></span></div><div class="num" id="par">…</div><small>Kurlardan hesaplanır</small></div>
    <div class="kpi" style="--c:var(--slate)"><div class="top"><span class="lb">Yerel saat</span><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div><div class="num" id="clock">--:--:--</div><small id="dayS"></small></div>
  </section>

  <div class="sec-h"><h2>Modüller</h2><span id="modCount"></span></div>
  <section class="grid" id="mods"></section>
  <p class="foot">Kur verileri: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a></p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const IC = {
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    steps:'<path d="M3 20h5v-5h5v-5h5V5h3"/>',
    steps2:'<path d="M3 20h4v-4h4v-4h4V8h6"/><path d="M18 3v4M16 5h4"/>',
    trend:'<path d="m22 7-8.500 8.500-5-5L2 17"/><path d="M16 7h6v6"/>',
    bank:'<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-7 10 7z"/>'
  };
  const svg = (k,s=22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
  const arrow = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  const MODULES = [
    {t:'Gecikme Bedeli Hesaplama', d:'Aylık gecikme oranı 3.7.', u:'https://mfyuser.github.io/palbull/gecikmefaiziv1.html', k:'clock'},
    {t:'Kademeli Tarife Hesaplama', d:'İlk Okuma ve Son Okuma tarihleriyle sm3 veya kcal olarak.', u:'https://mfyuser.github.io/palbull/kademe.html', k:'steps'},
    {t:'Kademeli Tarife Hesaplama V2', d:'Yeni Versiyon.', u:'https://mfyuser.github.io/palbull/kademev2.html', k:'steps2'},
    {t:'Kademeli Pay Ölçer TEST', d:'Hizmet için kullanıma uygun değildir.', u:'https://mfyuser.github.io/palbull/kademepayolcer.html', k:'steps2', test:true},
    {t:'Zam Oranı Hesaplama', d:'.', u:'https://mfyuser.github.io/palbull/zamorani.html', k:'trend'},
    {t:'İban Çözümleme', d:'Iban Hangi Bankaya Ait.', u:'https://mfyuser.github.io/palbull/iban.html', k:'bank',}
  ];

  function render(){
    $('mods').innerHTML = MODULES.map(m => `<a class="card" href="${m.u}" target="_blank" rel="noopener"><span class="tile">${svg(m.k,24)}</span><div><h3>${m.t}${m.test?'<span class="tag">Test</span>':''}</h3><p>${m.d}</p></div><span class="go">Aracı aç ${arrow}</span></a>`).join('');
    $('modCount').textContent = MODULES.length + ' araç';
    $('quick').querySelectorAll('.btn:not(.pri)').forEach(e => e.remove());
    $('quick').insertAdjacentHTML('afterbegin', MODULES.slice(0,3).map(m => `<a class="btn" href="${m.u}" target="_blank" rel="noopener">${svg(m.k,15)}${m.t.replace(' Hesaplama','')}</a>`).join(''));
    $('subMods').innerHTML = MODULES.map(m => `<a href="${m.u}" target="_blank" rel="noopener"><span class="sl">${svg(m.k,16)}</span>${m.t}</a>`).join('');
  }
  render();

  $('burger').onclick = () => document.body.classList.toggle('collapsed');
  if (innerWidth <= 1000) document.body.classList.add('collapsed');
  document.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { b.classList.toggle('open'); $(b.dataset.sub).classList.toggle('open'); });

  const q = $('q'), box = $('results');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLocaleLowerCase('tr');
    if (!v) { box.classList.remove('open'); return; }
    const all = [...MODULES.map(m=>({t:m.t,u:m.u,k:'Modül'}))];
    const hits = all.filter(x => x.t.toLocaleLowerCase('tr').includes(v));
    box.innerHTML = hits.length ? hits.map((h,i)=>`<a class="${i?'':'sel'}" href="${h.u}" target="_blank" rel="noopener">${h.t}<em>${h.k}</em></a>`).join('') : '<a style="color:var(--mut)">Sonuç bulunamadı</a>';
    box.classList.add('open');
  });
  q.addEventListener('keydown', e => { if (e.key==='Enter'){ const a = box.querySelector('a[href]'); if (a) a.click(); } if (e.key==='Escape'){ q.blur(); box.classList.remove('open'); } });
  document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); q.focus(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.remove('open'); });

  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    const c = t==='blue' ? '#1d4ed8' : '#b3141f';
    $('fav').href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="'+c+'"/><g fill="#fff" transform="translate(7 7) scale(.708)">'+$('mark').innerHTML+'</g></svg>');
  }
  let theme = 'red';
  try { theme = localStorage.getItem('pb-theme')==='blue' ? 'blue' : 'red'; } catch(e){}
  applyTheme(theme);
  $('theme').onclick = () => { theme = theme==='blue' ? 'red' : 'blue'; applyTheme(theme); try { localStorage.setItem('pb-theme', theme); } catch(e){} };

  function tick(){
    const n = new Date();
    $('clock').textContent = n.toLocaleTimeString('tr-TR');
    $('dayS').textContent = n.toLocaleDateString('tr-TR',{weekday:'long'});
    $('date').textContent = n.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric',weekday:'long'});
  }
  tick(); setInterval(tick, 1000);
  const hhmm = () => new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});

  const fmt = n => n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
  async function fetchRates(){
    $('refresh').classList.add('spin'); setTimeout(()=>$('refresh').classList.remove('spin'),700);
    try {
      const d = await (await fetch('https://open.er-api.com/v6/latest/USD')).json();
      const usd = d.rates.TRY, eur = usd / d.rates.EUR;
      $('usd').textContent = fmt(usd) + ' ₺'; $('eur').textContent = fmt(eur) + ' ₺'; $('par').textContent = (1/d.rates.EUR).toFixed(4);
      $('usdSub').textContent = $('eurSub').textContent = 'Son güncelleme ' + hhmm();
      $('dot').classList.remove('off'); $('stS').textContent = 'Çevrimiçi · ' + hhmm();
    } catch(e){
      console.error('Döviz kurları alınamadı:', e);
      $('usd').textContent = $('eur').textContent = $('par').textContent = '—';
      $('usdSub').textContent = $('eurSub').textContent = 'Kurlar alınamadı';
      $('dot').classList.add('off'); $('stS').textContent = 'Bağlantı yok';
    }
  }
  $('refresh').onclick = fetchRates; fetchRates(); setInterval(fetchRates, 600000);

      const u = Math.min(1,(n-t0)/D), loaded = document.readyState === 'complete' || n-t0 > 7000;
      let p = (1-Math.pow(1-u,2))*100; if (!loaded && p>92) p = 92;
      $('lbar').style.width = p+'%'; $('lpct').textContent = '%'+Math.round(p);
      if (p>=100){ setTimeout(finish,400); return; } requestAnimationFrame(step);
    })(t0);
    $('skip').onclick = finish; el.addEventListener('click', finish);
  })();
</script>
