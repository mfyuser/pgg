<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş Yap</title>
<!-- Supabase Kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
   body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
   .login-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
   input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
   button { width: 95%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
   button:hover { background-color: #0056b3; }
   #error-msg { color: red; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<div class="login-card">
<h2>Sisteme Giriş</h2>
<input type="password" id="passInput" placeholder="Şifrenizi Girin">
<button onclick="login()">Giriş Yap</button>
<p id="error-msg"></p>
</div>
<script>
 // SUPABASE BİLGİLERİNİ BURAYA YAZ
 const SUPABASE_URL = 'https://pulueyocgazlsydkfetk.supabase.co';
 const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bHVleW9jZ2F6bHN5ZGtmZXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzIxOTAsImV4cCI6MjEwMzc0ODE5MH0.WesR5VqpncPUeJ_3fMy1UCYB-acfIdn7utLigLZstZ0';
 const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 async function login() {
   const inputVal = document.getElementById('passInput').value;
   const errorMsg = document.getElementById('error-msg');
   errorMsg.innerText = '';
   if (!inputVal) {
     errorMsg.innerText = 'Lütfen bir şifre girin.';
     return;
   }
   // Supabase SQL fonksiyonunu çağırıyoruz
   const { data: role, error } = await supabaseClient.rpc('check_password', { pass_input: inputVal });
   if (error || !role) {
     errorMsg.innerText = 'Hatalı şifre!';
   } else {
     // Şifre doğruysa rolü tarayıcı hafızasına kaydet ve yönlendir
     sessionStorage.setItem('user_role', role);
     window.location.href = 'dashboard.html';
   }
 }
</script>
</body>
</html>
