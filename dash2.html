<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGG - Kolay Erişim</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: #fffafa;
    background-image: 
      radial-gradient(at 0% 0%, rgba(220, 38, 38, 0.18) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(239, 68, 68, 0.14) 0px, transparent 45%),
      radial-gradient(at 80% 100%, rgba(225, 29, 72, 0.16) 0px, transparent 50%),
      radial-gradient(at 10% 90%, rgba(254, 202, 202, 0.45) 0px, transparent 50%);
    background-size: 200% 200%;
    animation: bgMove 15s ease infinite alternate;
    color: #1f2937;
    min-height: 100vh;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Üst Bilgi Alanı */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 1360px;
    margin: 0 auto;
    animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .announcement-box {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-left: 4px solid #dc2626;
    border-radius: 16px;
    padding: 14px 20px;
    font-size: 0.92rem;
    color: #374151;
    flex: 1;
    box-shadow: 0 8px 32px rgba(220, 38, 38, 0.08);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.3s ease;
  }

  .announcement-box:hover {
    transform: scale(1.005);
  }

  .announcement-dot {
    width: 8px;
    height: 8px;
    background-color: #dc2626;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.22);
    flex-shrink: 0;
    animation: pulseDot 2s infinite;
  }

  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
    70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
  }

  /* Canlı Döviz Kurları Barı */
  .currency-ticker {
    display: flex;
    gap: 12px;
  }

  .currency-item {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    padding: 12px 18px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #1f2937;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(220, 38, 38, 0.06);
    white-space: nowrap;
    transition: all 0.3s ease;
  }

  .currency-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(220, 38, 38, 0.12);
    border-color: rgba(220, 38, 38, 0.3);
  }

  .currency-item span {
    color: #dc2626;
    font-weight: 700;
  }

  .datetime-box {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 14px 22px;
    border-radius: 16px;
    font-weight: 600;
    color: #ffffff;
    font-size: 0.88rem;
    white-space: nowrap;
    box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3);
    letter-spacing: 0.3px;
    transition: all 0.3s ease;
  }

  .datetime-box:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(220, 38, 38, 0.4);
  }

  /* Ana Konteyner */
  .dashboard-container {
    display: flex;
    flex-direction: column;
    gap: 36px;
    width: 100%;
    max-width: 1360px;
    margin: 0 auto;
    animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Bölüm Başlıkları */
  .section-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.2px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 22px;
    background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
    border-radius: 99px;
    box-shadow: 0 2px 10px rgba(220, 38, 38, 0.5);
  }

  /* 10'lu Modüller Grid Yapısı */
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px;
    width: 100%;
  }

  .module-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 22px;
    min-height: 124px;
    padding: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    box-shadow: 
      0 10px 30px -5px rgba(220, 38, 38, 0.07),
      inset 0 1px 1px rgba(255, 255, 255, 1);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Parıltı Efekti */
  .module-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    transition: 0.5s;
  }

  .module-card:hover::before {
    left: 100%;
  }

  .module-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    border: 2px solid rgba(220, 38, 38, 0);
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .module-card:hover {
    transform: translateY(-8px) scale(1.02);
    background: rgba(255, 255, 255, 0.95);
    border-color: rgba(239, 68, 68, 0.4);
    box-shadow: 
      0 22px 45px -10px rgba(220, 38, 38, 0.25),
      0 6px 15px rgba(220, 38, 38, 0.1),
      inset 0 0 15px rgba(254, 202, 202, 0.5);
  }

  .module-card:hover::after {
    border-color: rgba(220, 38, 38, 0.5);
    box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.2);
  }

  .module-card-content {
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 1;
  }

  .module-card-title {
    font-size: 1.02rem;
    font-weight: 700;
    color: #1f2937;
    line-height: 1.35;
    transition: color 0.3s ease;
  }

  .module-card:hover .module-card-title {
    color: #dc2626;
    text-shadow: 0 0 1px rgba(220, 38, 38, 0.2);
  }

  .module-card-subtitle {
    font-size: 0.78rem;
    font-weight: 600;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.3s ease;
  }

  .module-card:hover .module-card-subtitle {
    color: #ef4444;
    transform: translateX(4px);
  }

  .module-icon-wrapper {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(254, 226, 226, 0.8) 0%, rgba(255, 255, 255, 0.95) 100%);
    border: 1px solid rgba(252, 165, 165, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 10px;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.05);
  }

  .module-card:hover .module-icon-wrapper {
    transform: scale(1.12) rotate(-6deg);
    background: linear-gradient(135deg, rgba(254, 202, 202, 1) 0%, #ffffff 100%);
    border-color: #ef4444;
    box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25);
  }

  .module-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform 0.3s ease;
  }

  .module-card:hover img {
    transform: scale(1.05);
  }

  /* 5'li Borç Sorgulama (Logo) Grid Yapısı */
  .companies-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    width: 100%;
  }

  .company-card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    height: 104px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    box-shadow: 
      0 8px 24px -4px rgba(220, 38, 38, 0.06),
      inset 0 1px 1px rgba(255, 255, 255, 1);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .company-card:hover {
    background: rgba(255, 255, 255, 0.95);
    border-color: rgba(220, 38, 38, 0.4);
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 18px 35px -8px rgba(220, 38, 38, 0.2);
  }

  .company-card img {
    max-width: 82%;
    max-height: 75%;
    object-fit: contain;
    filter: grayscale(0.2) opacity(0.85);
    transition: all 0.35s ease;
  }

  .company-card:hover img {
    filter: grayscale(0) opacity(1);
    transform: scale(1.1);
  }

  /* Responsive Uyumluluk */
  @media (max-width: 1400px) {
    .modules-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 1200px) {
    .top-header {
      flex-direction: column;
      align-items: stretch;
    }
    .currency-ticker {
      justify-content: center;
    }
    .modules-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .companies-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 640px) {
    .currency-ticker {
      flex-direction: column;
    }
    .datetime-box {
      text-align: center;
    }
    .modules-grid,
    .companies-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header class="top-header">

<script>
  // Canlı Döviz Kurlarını Çekme Fonksiyonu
  async function fetchExchangeRates() {
    try {
      const response = await fetch('https://open.er-api.com/v6/latest/USD');
      const data = await response.json();
      if (data && data.rates && data.rates.TRY) {
        const usdToTry = data.rates.TRY;
        const eurToTry = usdToTry / data.rates.EUR;

        document.getElementById('usd-rate').textContent = usdToTry.toFixed(2) + ' ₺';
        document.getElementById('eur-rate').textContent = eurToTry.toFixed(2) + ' ₺';
      }
    } catch (error) {
      console.error("Döviz kurları alınamadı:", error);
      document.getElementById('usd-rate').textContent = 'Hata';
      document.getElementById('eur-rate').textContent = 'Hata';
    }
  }

  fetchExchangeRates();
  setInterval(fetchExchangeRates, 600000);
</script>

<script>
  const API_URL = '/api/settings';
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();
      if (data.announcement) {
        document.querySelector('.announcement-box').innerHTML =
          `<span class="announcement-dot"></span><div><strong>Duyuru:</strong> ${data.announcement}</div>`;
      }
      const companyCards = document.querySelectorAll('.company-card');
      if (data.companies && data.companies.length > 0) {
        data.companies.forEach((company, index) => {
          if (companyCards[index]) {
            companyCards[index].href = company.link;
            companyCards[index].querySelector('img').src = company.logo;
          }
        });
      }
    } catch (error) {
      console.error(error);
    }
  });
</script>

<script>
  function updateDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString("tr-TR", {
      day: "2-digit",
      month: "long",
      year: "numeric"
    });
    const time = now.toLocaleTimeString("tr-TR", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
    document.getElementById("datetime").textContent = `${date} | ${time}`;
  }
  updateDateTime();
  setInterval(updateDateTime, 1000);
</script>

</body>
