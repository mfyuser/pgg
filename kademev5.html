<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kademe</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root {
   --bg-gradient-1: #fff5f5;
   --bg-gradient-2: #fed7d7;
   --bg-gradient-3: #fecaca;
   
   --glass-bg: rgba(255, 255, 255, 0.65);
   --glass-bg-hover: rgba(255, 255, 255, 0.85);
   --glass-border: rgba(255, 255, 255, 0.8);
   --glass-shadow: rgba(220, 38, 38, 0.12);
   
   --theme-text: #2d3748;
   --theme-text-muted: #718096;
   --theme-primary: #dc2626;
   --theme-primary-hover: #b91c1c;
   --theme-primary-light: rgba(220, 38, 38, 0.08);
   
   --danger-bg: rgba(254, 226, 226, 0.85);
   --danger-text: #991b1b;
   --success-bg: rgba(220, 252, 231, 0.85);
   --success-text: #16a34a;
}

* {
   box-sizing: border-box;
}

body {
   background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 50%, #fecdd3 100%);
   background-attachment: fixed;
   color: var(--theme-text);
   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
   font-size: 13px;
   line-height: 1.4;
   margin: 0;
   padding: 20px;
   min-height: 100vh;
}

.glass-card {
   background: var(--glass-bg);
   backdrop-filter: blur(16px);
   -webkit-backdrop-filter: blur(16px);
   border: 1px solid var(--glass-border);
   border-radius: 16px;
   box-shadow: 0 8px 32px 0 var(--glass-shadow);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 14px 20px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    color: var(--theme-primary);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.header .mail {
    font-weight: 600;
    color: var(--theme-text-muted);
    background: rgba(255, 255, 255, 0.6);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
}

.settings-btn {
    position: fixed;
    left: 20px;
    bottom: 20px;
    background: var(--theme-primary);
    color: white;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 30px;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35);
    transition: all 0.3s ease;
    z-index: 99;
    display: flex;
    align-items: center;
    gap: 8px;
}

.settings-btn:hover {
    background: var(--theme-primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
}

.settings-panel {
    position: fixed;
    left: -340px;
    top: 0;
    width: 320px;
    height: 100%;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    padding: 24px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 10px 0 30px rgba(0,0,0,0.1);
    z-index: 100;
    overflow-y: auto;
}

.settings-panel.open {
    left: 0;
}

.settings-panel h4 {
    margin-top: 15px;
    color: var(--theme-primary);
    font-size: 16px;
}

.main {
    display: flex;
    gap: 20px;
    max-width: 1600px;
    margin: auto;
}

.left, .right {
    padding: 20px;
}

.left { flex: 1; }
.right { flex: 1.3; }

h2, h3 {
    color: var(--theme-primary);
    margin-top: 0;
    margin-bottom: 15px;
    font-weight: 700;
    font-size: 18px;
}

label { 
    display: block; 
    margin-top: 10px; 
    margin-bottom: 3px;
    font-weight: 600;
    color: var(--theme-text);
    font-size: 12px;
}

input, select, textarea {
    width: 100%;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.7);
    color: var(--theme-text);
    border: 1px solid rgba(220, 38, 38, 0.2);
    border-radius: 8px;
    outline: none;
    transition: all 0.2s ease;
    font-family: inherit;
    font-size: 13px;
}

input:focus, select:focus, textarea:focus {
    background: #ffffff;
    border-color: var(--theme-primary);
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
}

.form-row {
    display: flex;
    gap: 10px;
}

.form-row > div {
    flex: 1;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 12px;
    font-size: 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(220, 38, 38, 0.15);
}

th {
    background: rgba(220, 38, 38, 0.08);
    color: var(--theme-primary);
    padding: 8px 6px;
    font-weight: 700;
    border-bottom: 1px solid rgba(220, 38, 38, 0.15);
}

td {
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    background: rgba(255, 255, 255, 0.4);
}

tr:last-child td {
    border-bottom: none;
}

tr.red td {
    background: var(--danger-bg) !important;
    color: var(--danger-text) !important;
    font-weight: 600;
}

tr.green td {
    background: var(--success-bg) !important;
    color: var(--success-text) !important;
    font-weight: 600;
}

.months-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 10px;
}

.month-box {
    border: 1px solid rgba(220, 38, 38, 0.15);
    padding: 8px 4px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.5);
    text-align: center;
    font-size: 11px;
    transition: all 0.2s ease;
}

.month-box:hover {
    background: rgba(255, 255, 255, 0.9);
    transform: translateY(-1px);
}

.month-box.red-status {
    background: var(--danger-bg) !important;
    border-color: #fca5a5;
    color: var(--danger-text);
}

.month-box.green-status {
    background: var(--success-bg) !important;
    border-color: #86efac;
    color: var(--success-text);
}

.month-box.active {
    background: var(--theme-primary) !important;
    color: white;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(220, 38, 38, 0.25);
    border-color: var(--theme-primary);
}

.month-box.active b, .month-box.active span {
    color: white !important;
}

textarea {
    height: 110px;
    margin-top: 8px;
    resize: vertical;
}

button {
    margin-top: 14px;
    padding: 10px 14px;
    width: 100%;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: var(--theme-primary);
    border: none;
    color: white;
    border-radius: 8px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
}

button:hover {
    background: var(--theme-primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.8);
    color: var(--theme-primary);
    border: 1px solid rgba(220, 38, 38, 0.3);
    box-shadow: none;
}

.btn-secondary:hover {
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.highlight-limit {
    font-weight: bold;
    color: var(--danger-text);
}

.highlight-ok {
    font-weight: bold;
    color: var(--success-text);
}

::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.03);
}
::-webkit-scrollbar-thumb {
    background: rgba(220, 38, 38, 0.2);
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(220, 38, 38, 0.4);
}
</style>
</head>

<div class="main">

          <option value="merkezi">Merkezi</option>
        </select>
      </div>
      <div>
        <label>Daire Sayısı</label>
        <input type="number" id="daire" value="1">
      </div>
      <div>
        <label>İl</label>
        <select id="il" onchange="ayPanel()"></select>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label>İlk Okuma Tarihi</label>
        <input type="date" id="ilkT">
      </div>
      <div>
        <label>Son Okuma Tarihi</label>
        <input type="date" id="sonT">
      </div>
    </div>

    <div class="form-row">
      <div>
        <label>Tüketim Miktarı (kcal)</label>
        <input type="number" id="toplamKcal" placeholder="Örn: 1616,191" oninput="temizleSm3()">
      </div>
      <div>
        <label>Düzeltilmiş Tüketim (sm³)</label>
        <input type="number" id="toplamSm3" placeholder="Örn: 151,89" oninput="temizleKcal()">
      </div>
    </div>

    <button onclick="hesapla()">HESAPLA</button>
  </div>

  <div class="right glass-card">
    <h3>Hesaplama Sonuçları & Rapor</h3>
    <div id="sonuc" style="color: var(--theme-text-muted);">
      <p style="text-align: center; padding: 20px 0;">Hesaplama yapmak için formu doldurup "HESAPLA" butonuna tıklayınız.</p>
    </div>

    <h3 style="margin-top: 20px;">İl Bazlı Aylık Kademe Detayları</h3>
    <div id="ayPanel"></div>

    <label style="margin-top:15px;">Bilgilendirme Notu</label>
    <textarea id="not"></textarea>
  </div>

</div>

function toggleSettings(){

    panel.classList.toggle("open");
}

window.onload=function(){
    fillCityList();
    ayPanel();
    fillFiyatIl();
    document.getElementById("fiyatIl").addEventListener("change", fiyatTabloOlustur);
};

function fillCityList(){
    let s=document.getElementById("il");
    s.innerHTML="";
    Object.keys(cityData).forEach(il=>{
        s.innerHTML+=`<option>${il}</option>`;
    });
}

function fillFiyatIl(){
    let s=document.getElementById("fiyatIl");
    s.innerHTML="";
    Object.keys(cityData).forEach(il=>{
        s.innerHTML+=`<option>${il}</option>`;
    });
    fiyatTabloOlustur();
}

function fiyatTabloOlustur(){
    let il=document.getElementById("fiyatIl").value;

    if(!fiyatData[il]){
        fiyatData[il]=Array(12).fill().map(()=>({k1:0,k2:0}));
    }

    let html = `<table>
    <tr><th>Ay</th><th>1. Kademe</th><th>2. Kademe</th></tr>`;

    for(let i=0;i<12;i++){
        html+=`
        <tr>
            <td>${ayAd[i]}</td>
            <td><input type="number" step="0.01" id="k1_${i}" value="${fiyatData[il][i].k1}"></td>
            <td><input type="number" step="0.01" id="k2_${i}" value="${fiyatData[il][i].k2}"></td>
        </tr>`;
    }

    html+=`</table>`;
    document.getElementById("fiyatTablo").innerHTML=html;
}

function kaydetFiyatlar(){
    let il=document.getElementById("fiyatIl").value;
    fiyatData[il]=[];

    for(let i=0;i<12;i++){
        fiyatData[il][i]={
            k1: Number(document.getElementById(`k1_${i}`).value),
            k2: Number(document.getElementById(`k2_${i}`).value)
        };
    }

    localStorage.setItem("fiyatData", JSON.stringify(fiyatData));
    alert("Fiyatlar kaydedildi ✅");
}

function exportFiyatExcel(){
    let rows = [["İL","AY","1_KADEME","2_KADEME"]];

    for(let il in fiyatData){
        for(let ay=0; ay<12; ay++){
            rows.push([
                il,
                ayAd[ay],
                fiyatData[il][ay].k1,
                fiyatData[il][ay].k2
            ]);
        }
    }

    let wb = XLSX.utils.book_new();
    let ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "Fiyatlar");
    XLSX.writeFile(wb, "Birim_Fiyatlar.xlsx");
}

function importFiyatExcel(){
    let file = document.getElementById("fiyatExcelInput").files[0];
    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(e){
        let data = new Uint8Array(e.target.result);
        let wb = XLSX.read(data, {type:"array"});
        let ws = wb.Sheets["Fiyatlar"];
        let rows = XLSX.utils.sheet_to_json(ws, {header:1});

        let yeniFiyatData = {};

        for(let i=1; i<rows.length; i++){
            let [il, ay, k1, k2] = rows[i];
            if(!yeniFiyatData[il]){
                yeniFiyatData[il] = Array(12).fill().map(()=>({k1:0,k2:0}));
            }
            let ayIndex = ayAd.indexOf(ay);
            if(ayIndex > -1){
                yeniFiyatData[il][ayIndex] = {
                    k1: Number(k1),
                    k2: Number(k2)
                };
            }
        }

        fiyatData = yeniFiyatData;
        localStorage.setItem("fiyatData", JSON.stringify(fiyatData));
        fillFiyatIl();
        alert("Fiyatlar Excel’den yüklendi ✅");
    };

    reader.readAsArrayBuffer(file);
}

function ayPanel(){
   let il=document.getElementById("il").value;
   
   let renderMonthGrid = (start, end) => {
       let gridHtml = `<div class="months-grid">`;
       for(let i=start; i<=end; i++){
           let k1Fiyat = (fiyatData[il] && fiyatData[il][i]) ? fiyatData[il][i].k1 : 0;
           let k2Fiyat = (fiyatData[il] && fiyatData[il][i]) ? fiyatData[il][i].k2 : 0;
           let aylikKademe = cityData[il][i];
           let gunlukLim = gunlukLimit[il][i];
           
           let statusClass = "";
           if(globalActiveMonths.includes(i)) {
               if(globalMonthStatuses[i]) {
                   statusClass = "red-status";
               } else {
                   statusClass = "green-status";
               }
           }

           gridHtml+=`
<div class="month-box ${statusClass}">
    <b style="font-size:12px; display:block; border-bottom:1px solid rgba(0,0,0,0.06); padding-bottom:2px; margin-bottom:3px;">${ayAd[i]}</b>
    <span style="font-size:10px; display:block;">Aylık: <b>${aylikKademe} m³</b></span>
    <span style="font-size:10px; display:block;">Günlük: <b>${gunlukLim}</b></span>
    <span style="font-size:10px; display:block; color:var(--theme-primary);">K1: ${k1Fiyat.toFixed(2)}</span>
    <span style="font-size:10px; display:block; color:var(--theme-primary);">K2: ${k2Fiyat.toFixed(2)}</span>
</div>`;
       }
       gridHtml += `</div>`;
       return gridHtml;
   };

   let h = renderMonthGrid(0, 5) + renderMonthGrid(6, 11);
   document.getElementById("ayPanel").innerHTML=h;
}

function hesapla(){
 let kullanim = document.getElementById("kullanim").value;
 let il=document.getElementById("il").value;
 let ilkT=new Date(document.getElementById("ilkT").value);
 let sonT=new Date(document.getElementById("sonT").value);

 if(!ilkT || !sonT || isNaN(ilkT) || isNaN(sonT)){
     alert("Lütfen geçerli tarihleri giriniz.");
     return;
 }

 sonT.setDate(sonT.getDate()-1);

 let toplamKcal = Number(document.getElementById("toplamKcal").value);
 let toplamSm3Input = Number(document.getElementById("toplamSm3").value);

 let toplamTuk = 0;
 const KATSAYI = 10.64;

 if(toplamSm3Input > 0) {
     toplamTuk = toplamSm3Input;
 } else if(toplamKcal > 0) {
     toplamTuk = toplamKcal / KATSAYI;
 } else {
     alert("Lütfen tüketim miktarını (Kcal) veya Düzeltilmiş Tüketimi (sm³) giriniz.");
     return;
 }

 let daire = Number(document.getElementById("daire").value);

 if (isNaN(daire) || daire <= 0) {
     alert("Geçerli bir daire sayısı giriniz.");
     return;
 }

 toplamTuk = toplamTuk / daire;

 let toplamGun=(sonT-ilkT)/86400000 + 1
 let gunluk=toplamTuk/toplamGun;

let cursor=new Date(ilkT);
   globalActiveMonths=[];
   globalMonthStatuses={};
   let kademeList=[];
   let toplamTutar = 0;
   let notAyParcalari = [];
   let notLimitler = [];
   let notDurumlar = [];
   let html=`
<div style="margin-bottom: 10px; padding: 10px; background: rgba(255, 255, 255, 0.5); border-radius: 8px; border: 1px solid rgba(220, 38, 38, 0.15); font-size: 12px;">
  <span style="margin-right: 15px;"><b>Toplam Gün:</b> ${toplamGun.toFixed(0)}</span>
  <span style="margin-right: 15px;"><b>Düzeltilmiş Tüketim:</b> ${toplamTuk.toFixed(DECIMAL)} sm³</span>
  <span><b>Günlük Ort:</b> ${gunluk.toFixed(DECIMAL)} sm³</span>
</div>
<table>
<tr><th>Ay</th><th>Gün</th><th>Aylık Kullanım</th><th>Günlük Ort.</th><th>Limit</th><th>Kademe</th><th>Fatura</th></tr>
   `;
   while(cursor <= sonT){
       let ay=cursor.getMonth();
       globalActiveMonths.push(ay);
       let yil=cursor.getFullYear();
       let aySonGun=new Date(yil,ay+1,0);
       let bitis=aySonGun < sonT ? aySonGun : sonT;
       let g=(bitis.getDate() - cursor.getDate())+1;
       let ayTuk=g*gunluk;
       let limit=gunlukLimit[il][ay];
       let ikinci=gunluk>limit;
       
       globalMonthStatuses[ay] = ikinci;

       let fiyat1 = (fiyatData[il] && fiyatData[il][ay]) ? fiyatData[il][ay].k1 : 0;
       let fiyat2 = (fiyatData[il] && fiyatData[il][ay]) ? fiyatData[il][ay].k2 : 0;
       let ayTutar = 0;
       if (ikinci) {
           ayTutar = ayTuk * fiyat2;
       } else {
           ayTutar = ayTuk * fiyat1;
       }
       toplamTutar += ayTutar;
       kademeList.push(`${ayAd[ay]}: ${ikinci?"2. Kademe":"1. Kademe"}`);
       notAyParcalari.push(`${g} gün ${ayAd[ay].toLowerCase()} ayından`);
       notLimitler.push(`${ayAd[ay]} ayı günlük kademe limiti: ${limit.toFixed(DECIMAL).replace('.', ',')} sm3 tür.`);
       if (ikinci) {
           notDurumlar.push(`${ayAd[ay]} ayı günlük kademe limitini aştınız. (2.kademe)`);
       } else {
           notDurumlar.push(`${ayAd[ay]} ayı günlük kademe limitinin altındasınız. (1.kademe)`);
       }
       html+=`
<tr class="${ikinci ? "red" : "green"}">
<td>${ayAd[ay]}</td>
<td>${g}</td>
<td>${ayTuk.toFixed(DECIMAL)}</td>
<td>${gunluk.toFixed(DECIMAL)}</td>
<td>${limit.toFixed(DECIMAL)}</td>
<td>${ikinci?"2. KADEME":"1. KADEME"}</td>
<td>${ayTutar.toFixed(2)} TL</td>
</tr>`;
       cursor=new Date(bitis);
       cursor.setDate(cursor.getDate()+1);
   }
   html+="</table>";
   html+=`
<div style="
       margin-top:12px;
       padding:10px;
       border: 1px solid var(--theme-primary);
       border-radius:10px;
       font-size:16px;
       font-weight:bold;
       text-align:center;
       background: rgba(220, 38, 38, 0.08);
       color: var(--theme-primary);
       box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
   ">
   Toplam Tahmini Fatura: ${toplamTutar.toFixed(2)} TL
</div>
   `;
   document.getElementById("sonuc").innerHTML=html;
   let ilkStr = new Date(document.getElementById("ilkT").value).toLocaleDateString("tr-TR");
   let bitisEkraniTarih = new Date(sonT);
   let sonStr = bitisEkraniTarih.toLocaleDateString("tr-TR");
   document.getElementById("not").value =
`Sayın Müşterimiz;
${ilkStr} - ${sonStr} tarihleri arasında olan kullanımınıza ilişkin detaylar;

Faturanız ${notAyParcalari.join(" ve ")} kullanımı kapsamaktadır. Toplam ${toplamGun.toFixed(0)} günlüktür.
Toplam tüketiminiz: ${toplamTuk.toFixed(DECIMAL).replace('.', ',')} sm3'tür.
Günlük kullanımınızın tespiti için kullanımınız faturanızdaki gün sayısına bölünür.
${toplamTuk.toFixed(DECIMAL).replace('.', ',')} sm3 / ${toplamGun.toFixed(0)} gün = ${gunluk.toFixed(DECIMAL).replace('.', ',')} sm3 (Günlük Ortalama Kullanımınız)

${notLimitler.join("\n")}
${notDurumlar.join("\n")}

Aylık ve günlük kademe limitlerine ve sm3 satış fiyatlarına web sayfamızdan satış tarifeleri sayfasından ulaşabilirsiniz.
İyi günler dileriz.`;
   ayPanel();
}
