<!-- Supabase Bağlantı Kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  // 1. SUPABASE BİLGİLERİNİZİ GİRİN

  const SUPABASE_URL = 'https://pulueyocgazlsydkfetk.supabase.co'; 

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bHVleW9jZ2F6bHN5ZGtmZXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzIxOTAsImV4cCI6MjEwMzc0ODE5MH0.WesR5VqpncPUeJ_3fMy1UCYB-acfIdn7utLigLZstZ0';     

  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 2. TASARIMI VE SATIRLARI BOZMADAN KAYDETME İŞLEMİ

  document.addEventListener('DOMContentLoaded', () => {

    // Sayfadaki form veya kaydet butonunu yakalar

    const form = document.querySelector('form');

    const kaydetBtn = document.querySelector('button[type="submit"]') || document.querySelector('.btn-save') || document.querySelector('button');

    const kaydetFonksiyonu = async (e) => {

      e.preventDefault(); // 405 hatasını ve sayfa yenilemesini engeller

      // Ekranda mevcut olan tüm input, select ve textarea verilerini toplar

      const inputs = document.querySelectorAll('input, select, textarea');

      const formData = {};

      inputs.forEach((input, index) => {

        const key = input.id || input.name || `field_${index}`;

        if (key) {

          formData[key] = input.value;

        }

      });

      // Verileri JSON formatında doğrudan Supabase'e gönderir

      const { data, error } = await _supabase

        .from('settings')

        .insert([{ content: formData }]);

      if (error) {

        alert('Hata: ' + error.message);

        console.error('Supabase Hatası:', error);

      } else {

        alert('Değişiklikler başarıyla kaydedildi!');

      }

    };

    if (form) {

      form.addEventListener('submit', kaydetFonksiyonu);

    } else if (kaydetBtn) {

      kaydetBtn.addEventListener('click', kaydetFonksiyonu);

    }

  });
</script>
