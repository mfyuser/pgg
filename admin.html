<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Paneli</title>
<!-- Supabase Bağlantı Kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<!-- DASHBOARD / MENÜ GEÇİŞ BAĞLANTISI -->
<nav style="padding: 15px; background: #f4f4f4; margin-bottom: 20px;">
<a href="index.html" style="margin-right: 15px; font-weight: bold; text-decoration: none; color: #333;">← Dashboard'a Dön</a>
<span style="font-weight: bold; color: #007bff;">Yönetim Paneli</span>
</nav>
<h1>Yönetim Paneli Ayarları</h1>
<!-- FORM YAPISI -->
<form id="adminForm">
<div style="margin-bottom: 15px;">
<label for="modul_adi">Modül Adı:</label><br>
<input type="text" id="modul_adi" name="modul_adi" style="padding: 8px; width: 300px;">
</div>
<div style="margin-bottom: 15px;">
<label for="sirket_adi">Şirket Adı (Borç Sorgulama):</label><br>
<input type="text" id="sirket_adi" name="sirket_adi" style="padding: 8px; width: 300px;">
</div>
<!-- KAYDET BUTONU -->
<button type="submit" id="kaydetBtn" style="padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer;">
     Değişiklikleri Kaydet
</button>
</form>
<!-- SUPABASE KAYIT KODLARI (TÜM HATALARI ENGELER) -->
<script>
   // 1. SUPABASE BİLGİLERİNİZİ BURAYA GİRİN
   const SUPABASE_URL = 'https://pulueyocgazlsydkfetk.supabase.co';
   const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bHVleW9jZ2F6bHN5ZGtmZXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzIxOTAsImV4cCI6MjEwMzc0ODE5MH0.WesR5VqpncPUeJ_3fMy1UCYB-acfIdn7utLigLZstZ0';    
   const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
   // 2. KAYDETME İŞLEMİ
   document.getElementById('adminForm').addEventListener('submit', async function(e) {
     e.preventDefault(); // 405 HATASINI VE SAYFA YENİLENMESİNİ ENGELLER
     const kaydetBtn = document.getElementById('kaydetBtn');
     kaydetBtn.innerText = 'Kaydediliyor...';
     kaydetBtn.disabled = true;
     // Formdaki input verilerini toplar
     const formData = {
       modul_adi: document.getElementById('modul_adi').value,
       sirket_adi: document.getElementById('sirket_adi').value
     };
     // Supabase'deki 'settings' tablosuna doğrudan kaydeder
     const { data, error } = await _supabase
       .from('settings')
       .insert([formData]);
     if (error) {
       alert('Kaydedilirken hata oluştu: ' + error.message);
       console.error('Supabase Hatası:', error);
     } else {
       alert('Tüm değişiklikler başarıyla Supabase veri tabanına kaydedildi!');
     }
     kaydetBtn.innerText = 'Değişiklikleri Kaydet';
     kaydetBtn.disabled = false;
   });
</script>
</body>
</html>
