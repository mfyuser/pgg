<script>
 // Supabase Bilgilerinizi Buraya Yapıştırın
 const SUPABASE_URL = 'https://pulueyocgazlsydkfetk.supabase.co';
 const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bHVleW9jZ2F6bHN5ZGtmZXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzIxOTAsImV4cCI6MjEwMzc0ODE5MH0.WesR5VqpncPUeJ_3fMy1UCYB-acfIdn7utLigLZstZ0';            
 const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 // Sayfadaki HERHANGİ BİR butona tıklandığında çalışır
 document.addEventListener('click', async (e) => {
   // Tıklanan eleman buton mu veya kaydet kelimesi geçiyor mu?
   if (e.target.tagName === 'BUTTON' || e.target.type === 'submit' || e.target.innerText.includes('Kaydet')) {
     e.preventDefault();
     // Ekrandaki tüm input verilerini toplar
     const tumInputs = document.querySelectorAll('input, select, textarea');
     const veriObjesi = {};
     tumInputs.forEach((input, index) => {
       const anahtar = input.id || input.name || `alan_${index}`;
       veriObjesi[anahtar] = input.value;
     });
     // Doğrudan Supabase'e basar
     const { data, error } = await _supabase
       .from('settings')
       .insert([{ content: veriObjesi }]);
     if (error) {
       alert('Supabase Hatası: ' + error.message);
       console.error(error);
     } else {
       alert('BAŞARILI! Veri Supabase\'e yazıldı.');
     }
   }
 });
</script>
